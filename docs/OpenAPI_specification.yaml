openapi: 3.0.3
info:
  title: Flip API
  version: 0.5.1
  description: REST API for Flip.
servers:
  - url: http://localhost:8080/v1
    description: Development
tags:
  - name: Auth
  - name: Profile
  - name: Venues
  - name: Check-ins
  - name: Moments
  - name: Discovery
  - name: Reactions
  - name: Matches
  - name: Chat
  - name: Notifications
  - name: Safety
security:
  - bearerAuth: []
paths:
  /auth/otp/request:
    post:
      tags:
        - Auth
      summary: Gửi OTP tới số điện thoại
      description: Yêu cầu gửi mã OTP 6 chữ số; không tiết lộ tài khoản đã tồn tại hay chưa.
      operationId: requestOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  $ref: '#/components/schemas/Phone'
            example:
              phone: '+84901234567'
      responses:
        '202':
          description: Hệ thống đã chấp nhận yêu cầu gửi OTP; chưa đảm bảo SMS đã được giao tới điện 
            thoại
          content:
            application/json:
              schema:
                type: object
                required:
                  - expiresAt
                  - resendAvailableAt
                properties:
                  expiresAt:
                    type: string
                    format: date-time
                  resendAvailableAt:
                    type: string
                    format: date-time
                    description: Thời điểm nút "Gửi lại" khả dụng
              example:
                expiresAt: '2026-11-18T09:05:00Z'
                resendAvailableAt: '2026-11-18T09:01:00Z'
        '422':
          description: Số điện thoại không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VALIDATION_ERROR
                message: Số điện thoại phải đúng định dạng quốc tế E.164.
                requestId: req_validation_01
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/otp/verify:
    post:
      tags:
        - Auth
      summary: Xác minh OTP, đăng ký hoặc đăng nhập
      description: Xác minh mã OTP 6 chữ số; trả 200 khi đăng nhập và 201 khi tạo tài khoản mới. Phiên 
        được duy trì bằng refresh token rotation và thời gian không hoạt động 14 ngày.
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - code
                - deviceId
              properties:
                phone:
                  $ref: '#/components/schemas/Phone'
                code:
                  type: string
                  pattern: ^[0-9]{6}$
                  description: Mã OTP gồm đúng 6 chữ số.
                  minLength: 6
                  maxLength: 6
                  example: '012345'
                displayName:
                  type: string
                  description: Bắt buộc khi đăng ký mới
                deviceId:
                  type: string
            example:
              phone: '+84901234567'
              code: '012345'
              displayName: Trang 
              deviceId: 7d1c2f64-91ab-4a52-8e0f-6f3f6a2d9b10
      responses:
        '200':
          description: Đăng nhập tài khoản đã tồn tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                accessToken: example-access-token
                refreshToken: example-refresh-token
                expiresIn: 900
                refreshExpiresAt: '2026-12-02T09:00:00Z'
                user:
                  id: usr_existing_01
                  displayName: Nhi
                  status: active
                  createdAt: '2026-11-18T09:00:00Z'
                isNewAccount: false

        '201':
          description: Đăng ký tài khoản mới thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                accessToken: example-access-token
                refreshToken: example-refresh-token
                expiresIn: 900
                refreshExpiresAt: '2026-12-02T09:00:00Z'
                user:
                  id: usr_new_01
                  displayName: Nhi
                  status: active
                  createdAt: '2026-11-18T09:00:00Z'
                isNewAccount: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Thông tin xác minh OTP không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VALIDATION_ERROR
                message: OTP phải gồm đúng 6 chữ số.
                requestId: req_validation_02
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/social:
    post:
      tags:
        - Auth
      summary: Đăng ký/đăng nhập bằng Apple, Google hoặc Facebook
      description: Đăng nhập bằng ID token của Apple/Google hoặc access token Facebook đã được xác 
        minh. Phiên được duy trì bằng refresh token rotation và thời gian không hoạt động 14 ngày.
      operationId: socialAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - provider
                    - idToken
                    - deviceId
                  additionalProperties: false
                  properties:
                    provider:
                      type: string
                      enum:
                        - apple
                        - google
                    idToken:
                      type: string
                      minLength: 1
                    deviceId:
                      type: string
                      minLength: 1
                    displayName:
                      type: string
                - type: object
                  required:
                    - provider
                    - accessToken
                    - deviceId
                  additionalProperties: false
                  properties:
                    provider:
                      type: string
                      enum:
                        - facebook
                    accessToken:
                      type: string
                      minLength: 1
                    deviceId:
                      type: string
                      minLength: 1
                    displayName:
                      type: string
            examples:
              google:
                value:
                  provider: google
                  idToken: <provider-id-token>
                  deviceId: device-001
              facebook:
                value:
                  provider: facebook
                  accessToken: <provider-access-token>
                  deviceId: device-001
      responses:
        '200':
          description: Đăng nhập tài khoản đã tồn tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                accessToken: example-access-token
                refreshToken: example-refresh-token
                expiresIn: 900
                refreshExpiresAt: '2026-12-02T09:00:00Z'
                user:
                  id: usr_existing_01
                  displayName: Nhi
                  status: active
                  createdAt: '2026-11-18T09:00:00Z'
                isNewAccount: false

        '201':
          description: Đăng ký tài khoản mới thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                accessToken: example-access-token
                refreshToken: example-refresh-token
                expiresIn: 900
                refreshExpiresAt: '2026-12-02T09:00:00Z'
                user:
                  id: usr_new_01
                  displayName: Nhi
                  status: active
                  createdAt: '2026-11-18T09:00:00Z'
                isNewAccount: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Làm mới access token
      description: Refresh token rotation. Access token mới có TTL 900 giây; phiên hết hạn sau 14 ngày 
        không refresh thành công. Mỗi lần refresh thành công gia hạn cửa sổ 14 ngày; không áp dụng thời
        hạn tuyệt đối cố định khi phiên còn hợp lệ.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Cặp token mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                accessToken: <access-token>
                refreshToken: <refresh-token>
                expiresIn: 900
                refreshExpiresAt: '2026-12-02T09:00:00Z'
        '401':
          description: Refresh token hết hạn, bị thu hồi hoặc không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                expired:
                  value:
                    code: REFRESH_TOKEN_EXPIRED
                    message: Phiên đã hết hạn do không hoạt động trong 14 ngày.
                    requestId: req_31
                invalid:
                  value:
                    code: REFRESH_TOKEN_INVALID
                    message: Phiên đăng nhập không hợp lệ.
                    requestId: req_32
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Đăng xuất
      description: Thu hồi đúng phiên ứng với refreshToken, không thu hồi các thiết bị khác. Gọi lặp 
        khi phiên đã thu hồi vẫn trả 204. Khi offline client xóa phiên cục bộ và đồng bộ việc thu hồi 
        từ xa khi có kết nối. Không ảnh hưởng Moment, Check-in, Match hoặc Chat.
      operationId: logout
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Cho phép thu hồi cả khi access token đã hết hạn
                  minLength: 1
              required:
                - refreshToken
        required: true
      responses:
        '204':
          description: Phiên hiện tại đã được thu hồi (hoặc đã thu hồi trước đó); không có body
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/me:
    get:
      tags:
        - Profile
      summary: Lấy hồ sơ của tôi
      operationId: getMe
      responses:
        '200':
          description: Hồ sơ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      description: Trả hồ sơ tài khoản đã xác thực.
    patch:
      tags:
        - Profile
      summary: Cập nhật hồ sơ (thiết lập ban đầu hoặc chỉnh sửa)
      description: Cập nhật hồ sơ nguyên tử; lỗi dữ liệu hoặc tải avatar không ghi đè một phần.
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfile'
            example:
              displayName: Nhi
              bio: Thích cà phê đen và sách cũ
              interests:
                - cà phê
                - sách
                - chụp ảnh
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/UpdateProfile'
                - type: object
                  properties:
                    avatar:
                      type: string
                      format: binary
                      description: Ảnh đại diện JPEG, PNG hoặc WebP.
      responses:
        '200':
          description: Hồ sơ sau cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /venues:
    get:
      tags:
        - Venues
      summary: Liệt kê địa điểm trong bán kính 150 m
      description: Yêu cầu vị trí hiện tại (latitude, longitude, accuracy); chỉ trả địa điểm có khoảng 
        cách từ GPS đến tọa độ địa điểm không quá 150 m. q chỉ lọc trong phạm vi này. Không thể chọn 
        địa điểm ngoài bán kính.
      operationId: listVenues
      parameters:
        - name: latitude
          in: query
          schema:
            type: number
            minimum: -90
            maximum: 90
          example: 10.7731
          required: true
        - name: longitude
          in: query
          schema:
            type: number
            minimum: -180
            maximum: 180
          example: 106.6606
          required: true
        - name: accuracy
          in: query
          description: Độ chính xác GPS hiện tại do thiết bị báo cáo (mét).
          schema:
            type: number
            minimum: 0
          required: true
        - name: q
          in: query
          description: 'Tùy chọn: lọc tên các địa điểm nằm trong bán kính 150 m.'
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Các địa điểm cách vị trí hiện tại không quá 150 m (có thể rỗng).
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - page
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VenueSuggestion'
                  page:
                    $ref: '#/components/schemas/PageInfo'
              example:
                data:
                  - venue:
                      id: ven_01HZX3K9
                      name: Highlands Coffee – Thư viện Tạ Quang Bửu
                      category: cafe
                    isCurrent: false
                    distanceMeters: 73.4
                page:
                  limit: 20
                  hasMore: false
                  nextCursor:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /checkins/current:
    get:
      tags:
        - Check-ins
      summary: Trạng thái check-in hiện tại
      description: Trả check-in được giữ lại kể cả khi Moment hết hạn/bị xóa (activeMomentCount = 0). 
        checkin = null nếu chưa từng check-in hoặc đã chủ động hủy.
      operationId: getCheckinStatus
      responses:
        '200':
          description: Trạng thái
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinStatus'
              examples:
                active:
                  value:
                    checkin:
                      id: chk_01HZX4A2
                      venue:
                        id: ven_01HZX3K9
                        name: Highlands Coffee – Thư viện Tạ Quang Bửu
                        category: cafe
                      startedAt: '2026-11-18T09:15:00Z'
                      activeMomentCount: 1
                    restricted: false
                    canDiscover: true
                none:
                  value:
                    checkin:
                    restricted: false
                    canDiscover: false
                idle:
                  value:
                    checkin:
                      id: chk_01HZX4A2
                      venue:
                        id: ven_01HZX3K9
                        name: Highlands Coffee – Thư viện Tạ Quang Bửu
                        category: cafe
                      startedAt: '2026-11-18T09:15:00Z'
                      activeMomentCount: 0
                    restricted: false
                    canDiscover: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Check-ins
      summary: Hủy check-in hiện tại
      description: Chủ động kết thúc check-in, gỡ Moment còn hiệu lực và vô hiệu Like đang chờ. Match 
        và Chat đã tạo được giữ.
      operationId: cancelCheckin
      responses:
        '204':
          description: Check-in đã kết thúc
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /checkins/current/moments:
    get:
      tags:
        - Check-ins
      summary: Moment đang hiệu lực của tôi
      description: Trả 0 hoặc 1 Moment đang hiệu lực; khi check-in được giữ nhưng không có Moment thì 
        data = [].
      operationId: listCurrentMoments
      responses:
        '200':
          description: Danh sách có 0 hoặc 1 Moment còn hiệu lực.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyMoment'
                    maxItems: 1
              example:
                data:
                  - id: mom_01HZX4A3
                    photoUrl: https://cdn.flip.example.com/moments/mom_01HZX4A3.jpg
                    caption: Cà phê đen và deadline
                    venue:
                      id: ven_01HZX3K9
                      name: Highlands Coffee – Thư viện Tạ Quang Bửu
                      category: cafe
                    publishedAt: '2026-11-18T09:15:00Z'
                    expiresAt: '2026-11-18T11:15:00Z'
                    status: active
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /moments:
    post:
      tags:
        - Moments
      summary: Đăng Moment
      description: Mỗi tài khoản tối đa một Moment còn hiệu lực. Đăng thành công tạo check-in mới hoặc 
        dùng lại check-in tại cùng địa điểm. Khi Moment hết hạn sau 2 giờ hoặc bị xóa, check-in vẫn 
        được giữ nhưng Discovery tạm ngừng và Like chưa Match hết hiệu lực. Đăng tại địa điểm khác cần 
        xác nhận; chỉ khi đăng thành công mới kết thúc check-in cũ. Địa điểm phải nằm trong bán kính 
        150 m tính từ GPS hiện tại; server xác minh lại khi đăng. Replay đúng Idempotency-Key không tạo
        Moment trùng.
      operationId: createMoment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - photo
                - venueId
                - latitude
                - longitude
                - accuracy
              properties:
                photo:
                  type: string
                  format: binary
                  description: Ảnh JPEG, PNG hoặc WebP.
                venueId:
                  type: string
                  description: Địa điểm đã chọn từ /venues, cách vị trí GPS hiện tại không quá 150 m.
                caption:
                  type: string
                  maxLength: 50
                  description: Tùy chọn. Client chặn ký tự thứ 51; server vẫn kiểm tra.
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                accuracy:
                  type: number
                  minimum: 0
                  description: Bắt buộc trong POST; độ chính xác tính bằng mét do hệ điều hành trả về; 
                    server đối chiếu ngưỡng cấu hình (chưa xác định).
                confirmVenueSwitch:
                  type: boolean
                  default: false
                  description: true khi người dùng đã xác nhận đổi địa điểm. Nếu gửi lại sau lỗi xác 
                    nhận 409 với payload thay đổi, client dùng Idempotency-Key mới.
            encoding:
              photo:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: Moment được công bố; check-in được tạo hoặc cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMomentResponse'
              example:
                checkin:
                  id: chk_01HZX4A2
                  venue:
                    id: ven_01HZX3K9
                    name: Highlands Coffee – Thư viện Tạ Quang Bửu
                    category: cafe
                  startedAt: '2026-11-18T09:15:00Z'
                  activeMomentCount: 1
                moment:
                  id: mom_01HZX4A3
                  photoUrl: https://cdn.flip.example.com/moments/mom_01HZX4A3.jpg
                  caption: Cà phê đen và deadline
                  venue:
                    id: ven_01HZX3K9
                    name: Highlands Coffee – Thư viện Tạ Quang Bửu
                    category: cafe
                  publishedAt: '2026-11-18T09:15:00Z'
                  expiresAt: '2026-11-18T11:15:00Z'
                  status: active
          headers:
            Idempotent-Replayed:
              description: Chỉ có khi replay đúng request đã hoàn tất bằng cùng Idempotency-Key; true 
                nghĩa là response cũ được trả lại, không thực thi thêm.
              schema:
                type: boolean
              example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Moment đang có hiệu lực, đổi địa điểm chưa xác nhận hoặc xung đột idempotency.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                activeMoment:
                  value:
                    code: ACTIVE_MOMENT_EXISTS
                    message: Hãy chờ Moment hiện tại hết hạn hoặc xóa nó trước khi đăng mới.
                    requestId: req_25
                idempotencyInProgress:
                  value:
                    code: IDEMPOTENCY_IN_PROGRESS
                    message: Yêu cầu này đang được xử lý.
                    requestId: req_22
                idempotencyKeyReused:
                  value:
                    code: IDEMPOTENCY_KEY_REUSED
                    message: Idempotency-Key đã được sử dụng cho nội dung khác.
                    requestId: req_24
                venueSwitch:
                  value:
                    code: VENUE_SWITCH_CONFIRMATION_REQUIRED
                    message: Đăng tại địa điểm mới sẽ kết thúc check-in cũ. Hãy xác nhận để tiếp tục.
                    requestId: req_33
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: Dữ liệu không hợp lệ hoặc địa điểm vượt bán kính 150 m.
