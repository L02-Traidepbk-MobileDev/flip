  /moments/{momentId}/reactions:
    post:
      tags:
        - Reactions
      summary: Like hoặc Pass một Moment
      description: Like hướng tới tài khoản trong cặp check-in và chỉ được tạo khi hai bên đang có 
        Moment hợp lệ tại cùng địa điểm. Hai Like đối ứng hợp lệ tạo một Match duy nhất. Like chưa 
        thành Match hết hiệu lực khi Moment của một bên hết hạn, bị xóa/ẩn hoặc check-in bị hủy; không 
        hồi sinh khi đăng lại. Pass chỉ áp dụng cho Moment đích.
      operationId: reactToMoment
      parameters:
        - $ref: '#/components/parameters/MomentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
              properties:
                type:
                  type: string
                  enum:
                    - like
                    - pass
            examples:
              like:
                value:
                  type: like
              pass:
                value:
                  type: pass
      responses:
        '200':
          description: Trạng thái hiện có được giữ nguyên (gọi lặp, hoặc đã Like/Match/Report)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionResult'
              examples:
                alreadyReported:
                  value:
                    type: pass
                    matched: false
                    actionApplied: false
                    currentState: reported
                    match:
                alreadyPassed:
                  value:
                    type: pass
                    matched: false
                    actionApplied: false
                    currentState: passed
                    match:
          headers:
            Idempotent-Replayed:
              description: Chỉ có khi replay đúng request đã hoàn tất bằng cùng Idempotency-Key; true 
                nghĩa là response cũ được trả lại, không thực thi thêm.
              schema:
                type: boolean
              example: true
        '201':
          description: Reaction được ghi nhận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionResult'
              examples:
                pendingLike:
                  summary: Like chờ đối ứng
                  value:
                    type: like
                    matched: false
                    match:
                    currentState: liked
                    actionApplied: true
                mutual:
                  summary: Like thứ hai tạo Match
                  value:
                    type: like
                    matched: true
                    match:
                      id: mat_01HZX6C7
                      createdAt: '2026-11-18T09:52:10Z'
                      partner:
                        userId: usr_01HZW9Q2
                        displayName: Khả Vân
                        avatarUrl: https://cdn.flip.example.com/avatars/usr_01HZW9Q2.jpg
                        bio: Sinh viên Bách Khoa
                        interests:
                          - cà phê
                          - nhiếp ảnh
                      lastMessage:
                    currentState: matched
                    actionApplied: true
                pass:
                  value:
                    type: pass
                    matched: false
                    match:
                    currentState: passed
                    actionApplied: true
          headers:
            Idempotent-Replayed:
              description: Chỉ có khi replay đúng request đã hoàn tất bằng cùng Idempotency-Key; true 
                nghĩa là response cũ được trả lại, không thực thi thêm.
              schema:
                type: boolean
              example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
