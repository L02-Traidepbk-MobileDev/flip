                nghĩa là response cũ được trả lại, không thực thi thêm.
              schema:
                type: boolean
              example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "`Authorization: Bearer <accessToken>`. Hết hạn → `401 TOKEN_EXPIRED`; client gọi `/auth/refresh`
        rồi thử lại.\n"
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Con trỏ opaque lấy từ `page.nextCursor`
      schema:
        type: string
    MomentId:
      name: momentId
      in: path
      required: true
      schema:
        type: string
      example: mom_01HZX5B1
    MatchId:
      name: matchId
      in: path
      required: true
      schema:
        type: string
      example: mat_01HZX6C7
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Giữ cùng UUID khi gửi lại cùng một thao tác.
      schema:
        type: string
        format: uuid
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Giữ cùng UUID khi gửi lại cùng một thao tác.
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Thiếu hoặc sai thông tin xác thực
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            otpInvalid:
              value:
                code: OTP_INVALID
                message: Mã OTP không đúng.
                requestId: req_01
            otpExpired:
              value:
                code: OTP_EXPIRED
                message: Mã OTP đã hết hạn. Hãy gửi lại mã.
                requestId: req_02
            tokenExpired:
              value:
                code: TOKEN_EXPIRED
                message: Access token đã hết hạn.
                requestId: req_03
            unauthenticated:
              value:
                code: UNAUTHENTICATED
                message: Cần đăng nhập để tiếp tục.
                requestId: req_04
            refreshTokenInvalid:
              value:
                code: REFRESH_TOKEN_INVALID
                message: Phiên đăng nhập không hợp lệ.
                requestId: req_25
    Forbidden:
      description: Đã xác thực nhưng không được phép
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            restricted:
              value:
                code: ACCOUNT_RESTRICTED
                message: Tài khoản của bạn bị hạn chế đến hết thời gian pilot.
                requestId: req_05
            checkinRequired:
              value:
                code: CHECKIN_REQUIRED
                message: Bạn cần có check-in hợp lệ tại địa điểm này.
                requestId: req_06
            connectionClosed:
              value:
                code: CONNECTION_CLOSED
                message: Kết nối này đã kết thúc.
                requestId: req_07
            momentRequired:
              value:
                code: ACTIVE_MOMENT_REQUIRED
                message: Bạn cần đăng Moment còn hạn để khám phá.
                requestId: req_34
    NotFound:
      description: Không tìm thấy (hoặc không có quyền biết là có tồn tại)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Không tìm thấy tài nguyên.
            requestId: req_08
    Gone:
      description: Nội dung/đích không còn khả dụng
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            momentUnavailable:
              value:
                code: MOMENT_UNAVAILABLE
                message: Khoảnh khắc này không còn khả dụng.
                requestId: req_09
            targetUnavailable:
              value:
                code: TARGET_UNAVAILABLE
                message: Nội dung của thông báo này không còn khả dụng.
                requestId: req_10
    ValidationError:
      description: Dữ liệu không hợp lệ hoặc vi phạm quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            captionTooLong:
              value:
                code: CAPTION_TOO_LONG
                message: Caption tối đa 50 ký tự.
                requestId: req_12
            photoRequired:
              value:
                code: PHOTO_REQUIRED
                message: Cần có ảnh để đăng khoảnh khắc.
                requestId: req_13
            locationUnavailable:
              value:
                code: LOCATION_UNAVAILABLE
                message: Không lấy được vị trí. Ảnh không được đăng.
                requestId: req_14
            accuracy:
              value:
                code: LOCATION_ACCURACY_INSUFFICIENT
                message: Vị trí chưa đủ chính xác. Hãy thử lại.
                requestId: req_15
            validation:
              value:
                code: VALIDATION_ERROR
                message: Dữ liệu không hợp lệ.
                details:
                  - field: phone
                    issue: sai định dạng
                requestId: req_17
            venueOutOfRange:
              value:
                code: VENUE_OUT_OF_RANGE
                message: Địa điểm ngoài bán kính 150 m.
                requestId: req_26
    PayloadTooLarge:
      description: File vượt giới hạn dung lượng do hệ thống cấu hình.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: PAYLOAD_TOO_LARGE
            message: File vượt giới hạn dung lượng được cho phép.
            requestId: req_18
    UnsupportedMediaType:
      description: Định dạng ảnh không hỗ trợ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNSUPPORTED_MEDIA_TYPE
            message: Chỉ hỗ trợ JPEG, PNG, WebP.
            requestId: req_19
    TooManyRequests:
      description: Vượt giới hạn tần suất
      headers:
        Retry-After:
          description: Số giây cần chờ
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RATE_LIMITED
            message: Bạn thao tác quá nhanh, vui lòng thử lại sau.
            requestId: req_20
    InternalError:
      description: Lỗi máy chủ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: Đã có lỗi xảy ra. Vui lòng thử lại.
            requestId: req_21
    IdempotencyConflict:
      description: Khóa yêu cầu đang xử lý hoặc đã được dùng cho nội dung khác.
      headers:
        Retry-After:
          description: Chỉ có khi IDEMPOTENCY_IN_PROGRESS; số giây cần chờ.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            inProgress:
              value:
                code: IDEMPOTENCY_IN_PROGRESS
                message: Yêu cầu này đang được xử lý.
                requestId: req_22
            keyReused:
              value:
                code: IDEMPOTENCY_KEY_REUSED
                message: Idempotency-Key đã được dùng cho payload khác.
                requestId: req_24
  schemas:
    Error:
      type: object
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - PHOTO_REQUIRED
            - CAPTION_TOO_LONG
            - LOCATION_UNAVAILABLE
            - LOCATION_ACCURACY_INSUFFICIENT
            - UNAUTHENTICATED
            - TOKEN_EXPIRED
            - OTP_INVALID
            - OTP_EXPIRED
            - ACCOUNT_RESTRICTED
            - CHECKIN_REQUIRED
            - CONNECTION_CLOSED
            - NOT_FOUND
            - MOMENT_UNAVAILABLE
            - TARGET_UNAVAILABLE
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - RATE_LIMITED
            - IDEMPOTENCY_IN_PROGRESS
            - INTERNAL_ERROR
            - IDEMPOTENCY_KEY_REUSED
            - REFRESH_TOKEN_INVALID
            - ACTIVE_MOMENT_EXISTS
            - VENUE_OUT_OF_RANGE
            - REFRESH_TOKEN_EXPIRED
            - VENUE_SWITCH_CONFIRMATION_REQUIRED
            - ACTIVE_MOMENT_REQUIRED
        message:
          type: string
          description: Thông điệp hiển thị được cho người dùng
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string
        meta:
          type: object
          additionalProperties: true
          description: Dữ liệu có cấu trúc kèm theo (ví dụ cảnh báo chuyển địa điểm)
        requestId:
          type: string
    PageInfo:
      type: object
      required:
        - limit
        - hasMore
        - nextCursor
      properties:
        limit:
          type: integer
        hasMore:
          type: boolean
        nextCursor:
          type: string
          nullable: true
    Phone:
      type: string
      description: Số điện thoại quốc tế định dạng E.164.
      pattern: ^\+[1-9][0-9]{7,14}$
      example: '+84901234567'
    TokenPair:
      type: object
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - refreshExpiresAt
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Thời gian hiệu lực access token, tính bằng giây.
          example: 900
          enum:
            - 900
        refreshExpiresAt:
          type: string
          format: date-time
          description: Thời điểm phiên hết hạn nếu không refresh thành công thêm; được gia hạn 14 ngày 
            mỗi lần refresh.
      example:
        accessToken: <access-token>
        refreshToken: <refresh-token>
        expiresIn: 900
        refreshExpiresAt: '2026-12-02T09:00:00Z'
    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required:
            - user
            - isNewAccount
          properties:
            user:
              $ref: '#/components/schemas/Me'
            isNewAccount:
              type: boolean
              description: '`true` thì client mở UC-16 (Thiết lập hồ sơ ban đầu)'
    UpdateProfile:
      type: object
      properties:
        displayName:
          type: string
        bio:
          type: string
          nullable: true
        interests:
          type: array
          items:
            type: string
    Me:
      type: object
      required:
        - id
        - displayName
        - status
        - createdAt
      properties:
        id:
          type: string
          example: usr_01HZW8AA
        phone:
          $ref: '#/components/schemas/Phone'
        displayName:
          type: string
        avatarUrl:
          type: string
          format: uri
          nullable: true
        bio:
          type: string
          nullable: true
        interests:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - active
            - restricted
          description: Hoạt động hoặc bị hạn chế đến hết pilot.
        createdAt:
          type: string
          format: date-time
      example:
        id: usr_01HZW8AA
        displayName: Nhi
        avatarUrl:
        bio: Thích cà phê và đọc sách
        interests:
          - cà phê
          - đọc sách
        status: active
        createdAt: '2026-11-18T09:00:00Z'
    Partner:
      type: object
      description: Hồ sơ chỉ được xem sau khi Match.
      required:
        - userId
        - displayName
      properties:
        userId:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          format: uri
          nullable: true
        bio:
          type: string
          nullable: true
        interests:
          type: array
          items:
            type: string
    Venue:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
          description: Loại địa điểm.
          enum:
            - cafe
            - library
            - canteen
            - campus
            - other
    VenueSuggestion:
      type: object
      required:
        - venue
        - distanceMeters
      properties:
        venue:
          $ref: '#/components/schemas/Venue'
        isCurrent:
          type: boolean
          description: '`true` nếu là địa điểm của check-in hiện tại'
        distanceMeters:
          type: number
          minimum: 0
          maximum: 150
          description: Khoảng cách từ vị trí GPS hiện tại đến địa điểm, tính bằng mét.
    Checkin:
      type: object
      description: Check-in được lưu cho đến khi người dùng hủy hoặc chuyển sang địa điểm khác bằng một
        lần đăng Moment thành công. Có thể chưa có Moment hiệu lực.
      required:
        - id
        - venue
        - startedAt
        - activeMomentCount
      properties:
        id:
          type: string
        venue:
          $ref: '#/components/schemas/Venue'
        startedAt:
          type: string
          format: date-time
          description: Mốc bắt đầu từ lần đăng đầu tiên
        activeMomentCount:
          type: integer
          minimum: 0
          maximum: 1
          description: 0 khi Moment đã hết hạn hoặc bị xóa; 1 khi có Moment hiệu lực.
    CheckinStatus:
      type: object
      required:
        - checkin
        - restricted
        - canDiscover
      properties:
        checkin:
          oneOf:
            - $ref: '#/components/schemas/Checkin'
            - type: object
              nullable: true
              enum:
                - 
        restricted:
          type: boolean
        canDiscover:
          type: boolean
          description: Chỉ true khi check-in có một Moment còn hạn và tài khoản không bị hạn chế.
    MyMoment:
      type: object
      required:
        - id
        - photoUrl
        - venue
        - publishedAt
        - expiresAt
        - status
      properties:
        id:
          type: string
        photoUrl:
          type: string
          format: uri
        caption:
          type: string
          maxLength: 50
          nullable: true
        venue:
          $ref: '#/components/schemas/Venue'
        publishedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Hai giờ sau publishedAt.
        status:
          type: string
          enum:
            - active
            - expired
            - deleted
            - hidden
          description: Chỉ chủ sở hữu thấy trạng thái này
    CreateMomentResponse:
      type: object
      required:
        - checkin
        - moment
      properties:
        checkin:
          $ref: '#/components/schemas/Checkin'
        moment:
          $ref: '#/components/schemas/MyMoment'
      description: checkin là check-in mới hoặc check-in hiện có ở cùng địa điểm.
    Card:
      type: object
      description: Moment ẩn danh; không có danh tính tác giả hoặc tọa độ chi tiết.
      required:
        - id
        - photoUrl
        - venue
        - publishedAt
        - expiresAt
      properties:
        id:
          type: string
        photoUrl:
          type: string
          format: uri
        caption:
          type: string
          maxLength: 50
          nullable: true
        venue:
          $ref: '#/components/schemas/Venue'
        publishedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    DeckPage:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        page:
          $ref: '#/components/schemas/PageInfo'
    ReactionResult:
      type: object
      required:
        - type
        - matched
        - actionApplied
        - currentState
      properties:
        type:
          type: string
          enum:
            - like
            - pass
        matched:
          type: boolean
        match:
          oneOf:
            - $ref: '#/components/schemas/Match'
            - type: object
              nullable: true
              enum:
                - 
        actionApplied:
          type: boolean
          description: true nếu request này tạo reaction mới; false nếu không thay đổi trạng thái.
        currentState:
          type: string
          enum:
            - liked
            - passed
            - reported
            - matched
          description: Trạng thái tương tác đã ghi nhận của Moment.
    ReportReceipt:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - received
      example:
        status: received
    Match:
      type: object
      required:
        - id
        - partner
        - createdAt
      properties:
        id:
          type: string
        partner:
          $ref: '#/components/schemas/Partner'
        createdAt:
          type: string
          format: date-time
        lastMessage:
          oneOf:
            - $ref: '#/components/schemas/Message'
            - type: object
              nullable: true
              enum:
                - 
    MatchPage:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Match'
        page:
          $ref: '#/components/schemas/PageInfo'
    Message:
      type: object
      description: Tin nhắn văn bản không có giới hạn ký tự tối đa theo nghiệp vụ.
      required:
        - id
        - matchId
        - senderId
        - content
        - createdAt
      properties:
        id:
          type: string
        matchId:
          type: string
        senderId:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      example:
        id: msg_01HZX7D1
        matchId: mat_01HZX6C7
        senderId: usr_01HZW9Q2
        content: Xin chào!
        createdAt: '2026-11-18T09:55:03Z'
    MessagePage:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        page:
          $ref: '#/components/schemas/PageInfo'
    Notification:
      type: object
      required:
        - id
        - type
        - createdAt
        - text
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - like
            - match
            - message
            - new_moment
            - moment_expired
        text:
          type: string
          description: Không chứa danh tính trước Match
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true
    NotificationPage:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        page:
          $ref: '#/components/schemas/PageInfo'
    NotificationTarget:
      description: Dữ liệu điều hướng theo loại thông báo.
      oneOf:
        - type: object
          required:
            - kind
            - moment
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - moment
            moment:
              $ref: '#/components/schemas/Card'
        - type: object
          required:
            - kind
            - matchId
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - chat
            matchId:
              type: string
              minLength: 1
        - type: object
          required:
            - kind
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - discovery
        - type: object
          required:
            - kind
            - expiredMoment
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - expired_moment
            expiredMoment:
              $ref: '#/components/schemas/MyMoment'
        - type: object
          required:
            - kind
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - post_prompt
    BlockReceipt:
      type: object
      required:
        - id
        - createdAt
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
