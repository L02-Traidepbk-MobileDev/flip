services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: flip
      POSTGRES_USER: flip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "flip", "-d", "flip"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
